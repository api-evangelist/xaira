name: Xaira
description: Xaira Therapeutics is a South San Francisco-based biotechnology company building
  the transformative artificial intelligence that discovers and develops the next generation
  of medicines. Founded in 2023 and launched publicly in 2024 out of ARCH Venture Partners and
  Foresight Labs, Xaira couples large-scale generative and predictive AI models with in-house
  wet-lab data generation to design novel therapeutics, shorten development timelines, and lower
  the cost of bringing medicines to patients. The company's research spans protein design,
  molecular machine learning, and genome-scale perturbation modeling (its open X-Cell diffusion
  language model). Xaira does not currently operate a public developer platform, API, or SDK;
  this API Evangelist profile tracks its public web, security, and open-source research surface.
